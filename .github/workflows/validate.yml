name: Traffic Director validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find client server shared -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.4 -p "$file"
          done
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path("data").glob("*.json"):
              with p.open(encoding="utf-8") as f:
                  json.load(f)
              print("OK", p)
          PY
      - name: Validate NUI JavaScript
        run: node --check web/app.js
      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          required = ["scanMLOs", "mloSummary", "mloFindings", "avoidanceList"]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit("Missing NUI elements: " + ", ".join(missing))
          print("OK required NUI elements")
          PY
      - name: Validate traffic control invariants
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          adjustor = Path("client/adjustor.lua").read_text(encoding="utf-8")
          population = Path("client/population.lua").read_text(encoding="utf-8")
          settings = Path("server/settings.lua").read_text(encoding="utf-8")
          app = Path("web/app.js").read_text(encoding="utf-8")
          html = Path("web/index.html").read_text(encoding="utf-8")
          assert "TrafficAdjustor.features[k]=settings.features[k]==true" in adjustor, "Explicit disabled feature state must be preserved"
          for native in ("SetVehicleDensityMultiplierThisFrame", "SetRandomVehicleDensityMultiplierThisFrame", "SetParkedVehicleDensityMultiplierThisFrame", "SetPedDensityMultiplierThisFrame", "SetScenarioPedDensityMultiplierThisFrame"):
              assert native in population, f"Missing density control: {native}"
          assert "recentActions=recentSettingsAudit(20)" in settings, "Diagnostics must expose recent configuration audit entries"
          assert "Recent configuration audit" in app, "Control Center must render the audit panel"
          assert 'id="zoneName"' in html, "Named patrol/traffic zones must be supported"
          ids = re.findall(r'id="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate NUI IDs: " + ", ".join(duplicates))
          print("OK traffic controls, audit diagnostics, named zones, and unique NUI IDs")
          PY
      - name: Validate manifest file references
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("fxmanifest.lua").read_text(encoding="utf-8")
          files = ["client/detection.lua","client/routing.lua","client/recovery.lua","server/mlo_audit.lua","data/mlo_evidence.json"]
          for f in files:
              if f not in text and f != "data/mlo_evidence.json":
                  raise SystemExit("Manifest missing: " + f)
              if not Path(f).exists():
                  raise SystemExit("Missing file: " + f)
          print("OK module files")
          PY
